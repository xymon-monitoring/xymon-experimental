name: experimental build

# Integrates the open, non-draft pull requests of xymon-monitoring/xymon that
# carry a milestone, in milestone order, on top of main. See README.md.
#
# The integrate job handles pull-request code only through git, with a token
# that can only read. The publish job runs no pull-request code: it pushes the
# result, with the CI overlay on top, to candidate/<milestone>, which starts
# the build and tests workflows there; experimental-promote.yml moves
# experimental/<milestone> to a candidate once both pass.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experimental-build
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: experimental

      - name: Check out the recorded resolutions
        uses: actions/checkout@v4
        with:
          ref: rerere-cache
          path: rerere

      - name: Clone Xymon and fetch the pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list -R xymon-monitoring/xymon --state open -L 500 \
            --json number,isDraft,baseRefName,headRefName,milestone,headRefOid,body > prs.json
          git clone -q https://github.com/xymon-monitoring/xymon xymon
          cd xymon
          refs=$(jq -r '.[] | select((.isDraft|not) and .milestone != null) | "+refs/pull/\(.number)/head:refs/pr/\(.number)"' ../prs.json)
          git fetch -q origin $refs
          git fetch -q https://github.com/bonomani/xymon cmake/bootstrap
          git rev-parse FETCH_HEAD > ../overlay.sha
          git rev-parse origin/main > ../base.sha

      - name: Integrate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd xymon
          git config user.name "xymon-experimental"
          git config user.email "xymon-experimental@users.noreply.github.com"
          mkdir -p .git/rr-cache
          cp -R ../rerere/rr-cache/. .git/rr-cache/
          git checkout -q --detach origin/main
          bash ../experimental/scripts/select.sh ../prs.json origin/main > ../plan.tsv
          # A glue patch's Needs is met by a pull request merged upstream.
          head -qn1 ../experimental/glue/*.patch | sed 's/^Needs://' | tr ' ' '\n' | tr -d '#' | sort -u \
            | while read -r n; do
                [ -n "$n" ] || continue
                if [ "$(gh pr view "$n" -R xymon-monitoring/xymon --json state -q .state)" = MERGED ]; then echo "$n"; fi
              done > ../merged.txt
          bash ../experimental/scripts/integrate.sh ../plan.tsv ../experimental/glue ../merged.txt
          bash ../experimental/scripts/report.sh ../plan.tsv ../report.tsv "$(cat ../base.sha)" "$(cat ../overlay.sha)" > ../EXPERIMENTAL.md
          cat ../EXPERIMENTAL.md >> "$GITHUB_STEP_SUMMARY"
          awk -F'\t' '$1=="milestone"{print $3, "refs/heads/experimental/" $2}' ../report.tsv > ../milestones.txt
          while read -r sha ref; do git update-ref "$ref" "$sha"; done < ../milestones.txt
          git bundle create ../experimental.bundle $(cut -d' ' -f2 ../milestones.txt)

      - name: Keep the result
        uses: actions/upload-artifact@v4
        with:
          name: experimental-${{ github.run_id }}
          path: |
            EXPERIMENTAL.md
            plan.tsv
            report.tsv
            overlay.sha
            experimental.bundle

  publish:
    needs: integrate
    runs-on: ubuntu-24.04
    environment: publish
    steps:
      - name: Fetch the result
        uses: actions/download-artifact@v4
        with:
          name: experimental-${{ github.run_id }}

      - name: Push each milestone, with the CI overlay, as a candidate
        env:
          DEPLOY_KEY: ${{ secrets.EXPERIMENTAL_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          overlay=$(cat overlay.sha)
          git init -q work && cd work
          git config user.name "xymon-experimental"
          git config user.email "xymon-experimental@users.noreply.github.com"
          git fetch -q ../experimental.bundle '+refs/heads/experimental/*:refs/m/*'
          git fetch -q https://github.com/bonomani/xymon cmake/bootstrap
          git cat-file -e "$overlay^{commit}"
          refs=""
          for ref in $(git for-each-ref --format='%(refname)' refs/m/); do
            m=${ref#refs/m/}
            git checkout -q --detach "$ref"
            git rm -q -r --ignore-unmatch .github ci cmake-local cmake docker
            git checkout "$overlay" -- .github ci cmake-local cmake docker
            git commit -q -m "CI only: the lane machinery from cmake/bootstrap at ${overlay:0:9}"
            git update-ref "refs/c/$m" HEAD
            refs="$refs +refs/c/$m:refs/heads/candidate/$m"
          done
          git push -q git@github.com:${{ github.repository }}.git $refs
