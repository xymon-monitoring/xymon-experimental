name: experimental lanes

# For the current commit of each experimental/<milestone> branch, each time a
# lane run finishes, and once a day. A lane run is started with the workflow
# token, so its completion starts no workflow_run here; instead its last job,
# notify-lanes (cmake/bootstrap's pipeline-select-run-lanes.yml), dispatches
# this one with its run id, and this waits for that run to finish before
# reading it. The daily schedule is the safety net for a dispatch that never
# came.
#
#   - a lane GitHub cancelled because no runner took it ("not acquired by
#     Runner", macOS arm64 is short) is run again, once, when it is the only
#     kind of miss in its run. A lane that failed is not: its result is
#     information, and running it again until it passes would hide the
#     intermittent problems the lanes are there to find. GitHub reruns a
#     single job only once its whole run has finished, and one at a time, so
#     a run that mixes a failure with a capacity cancel is reported as it is;
#   - once every lane run for the branch's current commit has finished, one
#     comment on the status issue gives each lane's result, and mentions the
#     maintainer when one failed or stayed cancelled.
#
# Runs from main (a schedule always does), and runs no pull-request code.

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      after_run:
        description: Lane run to wait for before looking (notify-lanes passes its own)
        type: string
        default: ''

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: experimental-lanes
  cancel-in-progress: false

jobs:
  lanes:
    runs-on: ubuntu-24.04
    steps:
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/experimental-lanes.yml/enable"

      # The run that dispatched this one is still running its notify-lanes
      # job; read too early, it would count as busy and nothing would be
      # reported. It ends seconds later; ten minutes is a bound, not a wait.
      - name: Wait for the lane run that asked
        if: ${{ inputs.after_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.after_run }}
        run: |
          for _ in $(seq 60); do
            [ "$(gh run view "$RUN" -R "${{ github.repository }}" --json status -q .status)" = completed ] && exit 0
            sleep 10
          done
          echo "::warning::lane run $RUN had not finished after ten minutes; looking anyway"

      - name: Rerun capacity cancels, or report the lanes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NOTIFY: bonomani
        run: |
          set -euo pipefail
          # lane jobs of a run's latest attempt: id, conclusion, name
          lanes() {
            gh api --paginate "repos/$REPO/actions/runs/$1/jobs" \
              -q '.jobs[] | select(.name | test("build-matrix|redispatch|notify-lanes") | not)
                  | [.id, (.conclusion // "running"), (.name | split(" / ")[0])] | @tsv'
          }
          capacity() {
            gh api "repos/$REPO/check-runs/$1/annotations" -q '.[].message' 2>/dev/null \
              | grep -q "not acquired by Runner"
          }
          title="Experimental build: current state"
          num=$(gh issue list -R "$REPO" --state open --search "in:title \"$title\"" --json number,title \
                  -q ".[] | select(.title == \"$title\") | .number" | head -1)

          gh api "repos/$REPO/branches" --paginate -q '.[] | select(.name | startswith("experimental/")) | "\(.name) \(.commit.sha)"' \
          | while read -r BRANCH SHA; do
            runs=$(gh run list -R "$REPO" --workflow pipeline-select-run-lanes.yml --commit "$SHA" -L 100 \
                     --json databaseId,status,attempt -q '.[] | "\(.databaseId) \(.status) \(.attempt)"')
            [ -n "$runs" ] || continue
            busy=0
            while read -r RUN status attempt; do
              if [ "$status" != completed ]; then busy=1; continue; fi
              [ "$attempt" = 1 ] || continue
              cap=0 other=0
              while IFS=$'\t' read -r id c name; do
                case "$c" in
                  success|skipped) ;;
                  cancelled) if capacity "$id"; then cap=$((cap + 1)); else other=$((other + 1)); fi ;;
                  *) other=$((other + 1)) ;;
                esac
              done < <(lanes "$RUN")
              if [ "$cap" -gt 0 ] && [ "$other" -eq 0 ]; then
                gh api -X POST "repos/$REPO/actions/runs/$RUN/rerun-failed-jobs" > /dev/null
                echo "$BRANCH ${SHA:0:9}: reran $cap lane(s) GitHub cancelled for want of a runner (run $RUN)" >> "$GITHUB_STEP_SUMMARY"
                busy=1
              fi
            done <<< "$runs"
            [ "$busy" = 0 ] || continue
            [ -n "$num" ] || continue
            marker="<!-- lanes $SHA -->"
            # Read in full, then searched: grep -q stops at the marker, and gh
            # still writing the comments after it dies of SIGPIPE, which
            # pipefail would take for "no marker" -- and post the report again.
            comments=$(gh issue view "$num" -R "$REPO" --json comments -q '.comments[].body')
            if grep -qF "$marker" <<< "$comments"; then
              continue
            fi
            : > all.tsv
            while read -r RUN status attempt; do lanes "$RUN" >> all.tsv; done <<< "$runs"
            sort -t$'\t' -k3,3 -u all.tsv > lanes.tsv
            bad=$(awk -F'\t' '$2 != "success" && $2 != "skipped"' lanes.tsv | wc -l)
            {
              echo "$marker"
              if [ "$bad" -gt 0 ]; then
                echo "@$NOTIFY lanes on \`$BRANCH\` at \`${SHA:0:9}\`: $bad of $(wc -l < lanes.tsv) did not pass."
              else
                echo "Lanes on \`$BRANCH\` at \`${SHA:0:9}\`: all $(wc -l < lanes.tsv) passed."
              fi
              echo
              echo "| lane | result |"
              echo "|---|---|"
              awk -F'\t' '{ r = ($2 == "success") ? "passed" : $2; printf "| %s | %s |\n", $3, r }' lanes.tsv
            } > comment.md
            gh issue comment "$num" -R "$REPO" --body-file comment.md > /dev/null
            echo "$BRANCH ${SHA:0:9}: reported, $bad not passed" >> "$GITHUB_STEP_SUMMARY"
          done
