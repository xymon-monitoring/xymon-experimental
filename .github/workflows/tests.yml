name: tests

# The controller's own tests: the scripts, on small throwaway repositories.
# No Xymon build, no secret, nothing pushed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run every test
        run: bash tests/run.sh
