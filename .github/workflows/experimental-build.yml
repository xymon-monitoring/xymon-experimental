name: experimental build

# Integrates the open, non-draft pull requests of xymon-monitoring/xymon that
# carry a milestone, in milestone order, on top of main. See docs/how-it-works.md.
#
# The integrate job handles pull-request code only through git, with a token
# that can only read. The publish job runs no pull-request code: it pushes the
# result, with the CI overlay on top, to candidate/<milestone>, which starts
# the build and tests workflows there; experimental-promote.yml moves
# experimental/<milestone> to a candidate once both pass.

on:
  workflow_dispatch:
    inputs:
      if_changed:
        description: Build only if the inputs changed since the last build that published, as the schedule does
        type: boolean
        default: false
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: read

concurrency:
  group: experimental-build
  cancel-in-progress: false

jobs:
  # What the build tests, as one hash: the eligible pull requests (number,
  # head, milestone, base, Depends-on lines), main, the recorded resolutions,
  # and this repository's glue/ and scripts/. Not the CI overlay nor this
  # repository's workflows: they change how the lanes run, not what they test,
  # so they ride along with the next build that has something new to test (it
  # always takes the newest overlay), and a manual run applies them at once.
  # A scheduled run whose hash matches the last build that published stops
  # here; a manual run builds unless
  # asked to do the same.
  #
  # It also calls GitHub's "enable workflow" for this workflow, which resets
  # the 60 days without a commit after which GitHub pauses a schedule: this
  # repository only gets commits when its scripts or glue change.
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    outputs:
      build: ${{ steps.decide.outputs.build }}
      key: ${{ steps.fingerprint.outputs.key }}
    steps:
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/experimental-build.yml/enable"

      - name: Fingerprint the inputs
        id: fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            gh pr list -R xymon-monitoring/xymon --state open -L 500 \
              --json number,isDraft,baseRefName,headRefName,milestone,headRefOid,body \
              -q '[.[] | select((.isDraft|not) and .milestone != null)
                   | [.number, .headRefOid, .milestone.title, .baseRefName, .headRefName,
                      ([.body // "" | scan("(?m)^Depends-on: *#[0-9]+")] | join(","))]]
                  | sort_by(.[0]) | .[] | @tsv'
            git ls-remote https://github.com/xymon-monitoring/xymon refs/heads/main
            git ls-remote "https://github.com/${{ github.repository }}" refs/heads/rerere-cache
            gh api "repos/${{ github.repository }}/git/trees/${{ github.sha }}" \
              -q '.tree[] | select(.path == "glue" or .path == "scripts") | "\(.path) \(.sha)"'
          } > inputs.txt
          echo "key=experimental-inputs-$(sha256sum inputs.txt | cut -c1-32)" >> "$GITHUB_OUTPUT"
          echo "$(wc -l < inputs.txt) lines fingerprinted"

      - name: Look for a build of the same inputs
        id: seen
        uses: actions/cache/restore@v6
        with:
          path: inputs.txt
          key: ${{ steps.fingerprint.outputs.key }}
          lookup-only: true

      - name: Decide
        id: decide
        run: |
          if { [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.if_changed }}" = true ]; } \
             && [ "${{ steps.seen.outputs.cache-hit }}" = true ]; then
            echo "Nothing changed since the last build that published; nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  integrate:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    outputs:
      left_out: ${{ steps.integrate.outputs.left_out }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          path: experimental

      - name: Check out the recorded resolutions
        uses: actions/checkout@v7
        with:
          ref: rerere-cache
          path: rerere

      - name: Clone Xymon and fetch the pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list -R xymon-monitoring/xymon --state open -L 500 \
            --json number,isDraft,baseRefName,headRefName,milestone,headRefOid,body > prs.json
          git clone -q https://github.com/xymon-monitoring/xymon xymon
          cd xymon
          refs=$(jq -r '.[] | select((.isDraft|not) and .milestone != null) | "+refs/pull/\(.number)/head:refs/pr/\(.number)"' ../prs.json)
          git fetch -q origin $refs
          git fetch -q https://github.com/bonomani/xymon cmake/bootstrap
          git rev-parse FETCH_HEAD > ../overlay.sha
          git rev-parse origin/main > ../base.sha

      - name: Integrate
        id: integrate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd xymon
          git config user.name "xymon-experimental"
          git config user.email "xymon-experimental@users.noreply.github.com"
          mkdir -p .git/rr-cache
          cp -R ../rerere/rr-cache/. .git/rr-cache/
          git checkout -q --detach origin/main
          # Every commit dated as main's head: the same inputs then give the
          # same commits, so a run that changes nothing pushes nothing and
          # starts no lanes.
          export GIT_AUTHOR_DATE=$(git log -1 --format=%cI origin/main) GIT_COMMITTER_DATE=$(git log -1 --format=%cI origin/main)
          # A pull request merged upstream meets a glue patch's Needs and a
          # Depends-on line alike: its changes are in main already. Only the
          # numbers that are not open pull requests are asked about.
          { head -qn1 ../experimental/glue/*.patch | sed 's/^Needs://' | tr ' ' '\n' | tr -d '#'
            jq -r '.[].body // "" | scan("(?m)^Depends-on: *#([0-9]+)") | .[0]' ../prs.json
          } | { grep -x '[0-9][0-9]*' || true; } | sort -un \
            | { grep -vxF -f <(jq -r '.[].number' ../prs.json) || true; } \
            | while read -r n; do
                if [ "$(gh pr view "$n" -R xymon-monitoring/xymon --json state -q .state)" = MERGED ]; then echo "$n"; fi
              done > ../merged.txt
          bash ../experimental/scripts/select.sh ../prs.json origin/main ../merged.txt > ../plan.tsv
          bash ../experimental/scripts/integrate.sh ../plan.tsv ../experimental/glue ../merged.txt
          bash ../experimental/scripts/report.sh ../plan.tsv ../report.tsv "$(cat ../base.sha)" "$(cat ../overlay.sha)" > ../EXPERIMENTAL.md
          cat ../EXPERIMENTAL.md >> "$GITHUB_STEP_SUMMARY"
          # One warning per pull request or glue patch left out, on the run's page.
          awk -F'\t' '($1=="pr" && ($3=="conflict"||$3=="skipped")){printf "#%s left out: %s %s\n", $2, $3, $4}
                       ($1=="glue" && $3=="failed"){printf "glue %s: %s\n", $2, $4}' ../report.tsv > ../left-out.txt
          while read -r line; do echo "::warning::$line"; done < ../left-out.txt
          # An obsolete glue patch is not a failure: a notice, so it gets deleted.
          awk -F'\t' '$1=="glue" && $3=="obsolete"{printf "::notice::glue %s is already in main; delete it from glue/\n", $2}' ../report.tsv
          echo "left_out=$(wc -l < ../left-out.txt)" >> "$GITHUB_OUTPUT"
          awk -F'\t' '$1=="milestone"{print $3, "refs/heads/experimental/" $2}' ../report.tsv > ../milestones.txt
          while read -r sha ref; do git update-ref "$ref" "$sha"; done < ../milestones.txt
          git bundle create ../experimental.bundle $(cut -d' ' -f2 ../milestones.txt)

      - name: Keep the result
        uses: actions/upload-artifact@v7
        with:
          name: experimental-${{ github.run_id }}
          path: |
            EXPERIMENTAL.md
            plan.tsv
            report.tsv
            left-out.txt
            overlay.sha
            experimental.bundle

  publish:
    needs: [check, integrate]
    runs-on: ubuntu-24.04
    environment: publish
    permissions:
      contents: read
      actions: write   # cancelling lanes on code a candidate replaces
    steps:
      - name: Fetch the result
        uses: actions/download-artifact@v8
        with:
          name: experimental-${{ github.run_id }}

      - name: Push each milestone, with the CI overlay, as a candidate
        env:
          DEPLOY_KEY: ${{ secrets.EXPERIMENTAL_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          overlay=$(cat overlay.sha)
          git init -q work && cd work
          git config user.name "xymon-experimental"
          git config user.email "xymon-experimental@users.noreply.github.com"
          git fetch -q ../experimental.bundle '+refs/heads/experimental/*:refs/m/*'
          git fetch -q https://github.com/bonomani/xymon cmake/bootstrap
          git cat-file -e "$overlay^{commit}"
          refs=""
          for ref in $(git for-each-ref --format='%(refname)' refs/m/); do
            m=${ref#refs/m/}
            git checkout -q --detach "$ref"
            git rm -q -r --ignore-unmatch .github ci cmake-local cmake docker
            git checkout "$overlay" -- .github ci cmake-local cmake docker
            d=$(git log -1 --format=%cI HEAD)
            GIT_AUTHOR_DATE=$d GIT_COMMITTER_DATE=$d git commit -q -m "CI only: the lane machinery from cmake/bootstrap at ${overlay:0:9}"
            git update-ref "refs/c/$m" HEAD
            refs="$refs +refs/c/$m:refs/heads/candidate/$m"
          done
          git push -q git@github.com:${{ github.repository }}.git $refs

      # The newest milestone's lanes test experimental/<m>. Once a candidate
      # with different code is pushed, they test code about to be replaced,
      # and hold runners the candidate's build and tests then queue for: cancel
      # them now rather than at promotion. Not when the code is the same (a
      # manual rebuild), and never an older milestone's (a preview's lanes).
      # Should the candidate fail, experimental/<m> has no lane results until
      # a build passes; the lanes report waits for that (experimental-lanes.yml).
      - name: Cancel lanes on code a candidate replaces
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd work
          m=$(git for-each-ref --format='%(refname:lstrip=2)' refs/c/ | sort -V | tail -1)
          old=$(gh api "repos/$REPO/branches/experimental%2F$m" -q .commit.sha 2>/dev/null) || exit 0
          git fetch -q "https://github.com/$REPO" "experimental/$m"
          if [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse "refs/c/$m^{tree}")" ]; then
            echo "candidate/$m has the same code as experimental/$m: its lanes go on" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh run list -R "$REPO" --workflow pipeline-select-run-lanes.yml -L 100 \
            --json databaseId,status,headSha,headBranch \
            -q ".[] | select(.status != \"completed\" and .headSha == \"$old\" and .headBranch == \"experimental/$m\") | .databaseId" \
            | while read -r id; do
                gh run cancel "$id" -R "$REPO" || true
                echo "cancelled lane run $id on experimental/$m (${old:0:9})" >> "$GITHUB_STEP_SUMMARY"
              done

      - name: Remember these inputs as built
        run: echo "${{ needs.check.outputs.key }}" > inputs.txt

      - name: Store the fingerprint
        uses: actions/cache/save@v6
        with:
          path: inputs.txt
          key: ${{ needs.check.outputs.key }}

  # The report, as one issue rewritten by every run; the "Lanes" block that
  # experimental-lanes.yml writes into it is carried over unchanged. The body
  # is the current state; a comment is written only when something is left
  # out and that set changed, and it mentions the maintainer. Then the run
  # fails if anything was left out, so the run list shows it and GitHub emails
  # whoever last edited the schedule. The branches are published either way.
  report:
    needs: [integrate, publish]
    if: always() && needs.integrate.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Fetch the result
        uses: actions/download-artifact@v8
        with:
          name: experimental-${{ github.run_id }}

      - name: Rewrite the status issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTIFY: bonomani
        run: |
          set -euo pipefail
          title="Experimental build: current state"
          num=$(gh issue list -R "$REPO" --state open --search "in:title \"$title\"" --json number,title \
                  -q ".[] | select(.title == \"$title\") | .number" | head -1)
          old="" lanes=""
          if [ -n "$num" ]; then
            body=$(gh issue view "$num" -R "$REPO" --json body -q .body)
            old=$(sed -n '/^<!-- left-out$/,/^-->$/p' <<< "$body" | sed '1d;$d')
            lanes=$(sed -n '/^<!-- lanes -->$/,/^<!-- \/lanes -->$/p' <<< "$body")
          fi
          if [ -z "$lanes" ]; then
            lanes=$(printf '%s\n' "<!-- lanes -->" "## Lanes" "" \
              "No lane result yet: the \`experimental lanes\` workflow writes this block." "<!-- /lanes -->")
          fi
          new=$(sort left-out.txt)
          {
            echo "Rewritten by each run of the experimental build; the latest is [this run]($RUN_URL)."
            echo
            if [ -s left-out.txt ]; then
              echo "**Left out of this build:**"
              echo
              sed 's/^/- /' left-out.txt
            else
              echo "**Nothing left out.**"
            fi
            echo
            printf '%s\n' "$lanes"
            echo
            cat EXPERIMENTAL.md
            echo
            echo "<!-- left-out"
            printf '%s\n' "$new"
            echo "-->"
          } > body.md
          if [ -z "$num" ]; then
            num=$(gh issue create -R "$REPO" --title "$title" --body-file body.md | sed 's|.*/||')
          else
            gh issue edit "$num" -R "$REPO" --body-file body.md > /dev/null
          fi
          # The body says when nothing is left out any more; a comment is for
          # what someone has to act on.
          if [ -s left-out.txt ] && [ "$new" != "$old" ]; then
            {
              echo "@$NOTIFY what this build leaves out has changed ([run]($RUN_URL))."
              echo
              sed 's/^/- /' left-out.txt
            } > comment.md
            gh issue comment "$num" -R "$REPO" --body-file comment.md > /dev/null
          fi

      - name: Fail the run if anything was left out
        if: needs.integrate.outputs.left_out != '0'
        run: |
          echo "::error::${{ needs.integrate.outputs.left_out }} pull request(s) or glue patch(es) left out; see the warnings above and the status issue."
          exit 1
