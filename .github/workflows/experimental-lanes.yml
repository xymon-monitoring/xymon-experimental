name: experimental lanes

# For the current commit of each experimental/<milestone> branch, each time a
# lane run finishes, and once a day. The lanes themselves run daily on the
# oldest milestone -- the release being driven, started by
# experimental-promote.yml each time its branch moves -- and once a week, on
# Sunday, on the newest milestone, whose branch holds every milestone's pull
# requests; that weekly start is the second schedule below. A lane run is
# started with the workflow token, so its completion starts no workflow_run
# here; instead its last job,
# notify-lanes (cmake/bootstrap's pipeline-select-run-lanes.yml), dispatches
# this one with its run id, and this waits for that run to finish before
# reading it. The daily schedule is the safety net for a dispatch that never
# came.
#
#   - a lane GitHub cancelled because no runner took it ("not acquired by
#     Runner", macOS arm64 is short) is run again, once, when it is the only
#     kind of miss in its run. A lane that failed is not: its result is
#     information, and running it again until it passes would hide the
#     intermittent problems the lanes are there to find. GitHub reruns a
#     single job only once its whole run has finished, and one at a time, so
#     a run that mixes a failure with a capacity cancel is reported as it is;
#   - once every lane run for the branch's current commit has finished, the
#     "Lanes" block of the status issue's body gets one row for the milestone:
#     the commit, how many lanes passed, and each lane that did not, by name.
#     The body is the current state; a comment is written only when a commit's
#     lanes finished with one not passed, once per commit, and it mentions the
#     maintainer. A lane run is finished when each of its jobs has a result:
#     GitHub can take many minutes to mark the run itself completed, and the
#     dispatch that asked for this look came from its last job;
#   - once every lane on a milestone's current commit has passed, a draft
#     preview made from that commit is published, whatever the milestone:
#     experimental-preview.yml leaves a draft and starts the lanes, and this is
#     where they finish. A lane GitHub cancelled for want of a runner is run
#     again first (above), so the draft waits for that rerun's result;
#   - once the newest milestone's weekly lanes have all passed, its next preview is
#     made and published (experimental-preview.yml), at most once a week and
#     not while one of its previews is still a draft. That preview costs no
#     lane: they already ran on its commit. An older milestone's preview needs
#     lanes of its own and stays by hand.
#
# Runs from main (a schedule always does), and runs no pull-request code.

on:
  schedule:
    - cron: '17 12 * * *'    # the daily look
    - cron: '47 1 * * 0'     # Sunday: start the newest milestone's weekly lanes, then look
  workflow_dispatch:
    inputs:
      after_run:
        description: Lane run to wait for before looking (notify-lanes passes its own)
        type: string
        default: ''
      dry_run:
        description: Print the body block and any comment on the run's summary instead of writing them; rerun nothing
        type: boolean
        default: false

permissions:
  contents: write   # publishing a draft preview whose lanes passed
  actions: write
  issues: write

concurrency:
  group: experimental-lanes
  cancel-in-progress: false

jobs:
  lanes:
    runs-on: ubuntu-24.04
    steps:
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/experimental-lanes.yml/enable"

      # The run that dispatched this one is still running its notify-lanes
      # job; read too early, it would count as busy and nothing would be
      # reported. It ends seconds later; ten minutes is a bound, not a wait.
      # Its jobs are what is waited for, not the run's own status, which
      # GitHub may leave "in progress" long after the last job ended.
      - name: Wait for the lane run that asked
        if: ${{ inputs.after_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.after_run }}
        run: |
          for _ in $(seq 60); do
            running=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/$RUN/jobs?per_page=100" \
                        -q '.jobs[] | select(.conclusion == null) | .id' | wc -l)
            [ "$running" -eq 0 ] && exit 0
            sleep 10
          done
          echo "::warning::lane run $RUN had not finished after ten minutes; looking anyway"

      # Once a week, on the newest milestone's current commit, unless lanes
      # already ran on it -- a week with no change costs nothing. The oldest
      # milestone's lanes are started by experimental-promote.yml when its
      # branch moves; when the two are one milestone, that covers it and this
      # finds its runs. The family list is the one experimental-promote.yml uses.
      - name: Start the weekly lanes on the newest milestone
        if: ${{ github.event.schedule == '47 1 * * 0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          newest=$(gh api "repos/$REPO/branches" --paginate -q '.[].name' | sed -n 's|^experimental/||p' | sort -V | tail -1)
          [ -n "$newest" ] || { echo "no experimental/ branch; no weekly lanes" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          sha=$(gh api "repos/$REPO/branches/experimental%2F$newest" -q .commit.sha)
          if [ -n "$(gh run list -R "$REPO" --workflow pipeline-select-run-lanes.yml --commit "$sha" -L 1 --json databaseId -q '.[].databaseId')" ]; then
            echo "weekly lanes: experimental/$newest at ${sha:0:9} already has lane runs; none started" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for f in alpine archlinux centos7 debian amazonlinux freebsd netbsd openbsd opensuse rockylinux almalinux fedora oraclelinux ubuntu solaris; do
            gh workflow run pipeline-select-run-lanes.yml -R "$REPO" --ref "experimental/$newest" \
              -f family="$f" -f arch=amd64 -f variant=server -f verify_depth=test
          done
          gh workflow run pipeline-select-run-lanes.yml -R "$REPO" --ref "experimental/$newest" \
            -f family=macos -f arch=all -f variant=server -f verify_depth=test
          echo "weekly lanes started on experimental/$newest (${sha:0:9})" >> "$GITHUB_STEP_SUMMARY"

      - name: Rerun capacity cancels, or report the lanes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LANES_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/pipeline-select-run-lanes.yml
          NOTIFY: bonomani
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          set -euo pipefail
          # The lanes of a run, one line each: name, result of its latest
          # attempt ("running" while it has none), job id of that attempt,
          # and "rerun" when an earlier attempt of the lane did not pass.
          lanes() {
            gh api --paginate "repos/$REPO/actions/runs/$1/jobs?filter=all&per_page=100" \
              -q '[.jobs[] | select(.name | test("build-matrix|redispatch|notify-lanes") | not)]
                  | group_by(.name | split(" / ")[0]) | .[]
                  | (max_by(.run_attempt)) as $l
                  | [ ($l.name | split(" / ")[0]), ($l.conclusion // "running"), $l.id,
                      (if ([.[] | select(.run_attempt < $l.run_attempt and .conclusion != "success")] | length) > 0 then "rerun" else "" end) ]
                  | @tsv'
          }
          capacity() {
            gh api "repos/$REPO/check-runs/$1/annotations" -q '.[].message' 2>/dev/null \
              | grep -q "not acquired by Runner"
          }
          title="Experimental build: current state"
          num=$(gh issue list -R "$REPO" --state open --search "in:title \"$title\"" --json number,title \
                  -q ".[] | select(.title == \"$title\") | .number" | head -1)
          body=""
          [ -z "$num" ] || body=$(gh issue view "$num" -R "$REPO" --json body -q .body)
          # The block as it stands: its rows are the memory of what was
          # reported, so a commit whose misses were already commented on is
          # not commented on again.
          old=$(sed -n '/^<!-- lanes -->$/,/^<!-- \/lanes -->$/p' <<< "$body" | sed '1d;$d')
          old_row() { grep -E "^\| $1 \| " <<< "$old" | head -1 || true; }
          old_commit() { old_row "$1" | awk -F' \\| ' '{ gsub(/`/, "", $2); print $2 }'; }

          branches=$(gh api "repos/$REPO/branches" --paginate -q '.[] | "\(.name) \(.commit.sha)"')
          newest=$(sed -n 's|^experimental/\([^ ]*\) .*|\1|p' <<< "$branches" | sort -V | tail -1)
          oldest=$(sed -n 's|^experimental/\([^ ]*\) .*|\1|p' <<< "$branches" | sort -V | head -1)
          : > rows.md
          : > comments.md
          green=
          while read -r BRANCH SHA; do
            ms=${BRANCH#experimental/}
            short=${SHA:0:9}
            link="$LANES_URL?query=branch%3A$(printf '%s' "$BRANCH" | sed 's|/|%2F|g')"
            keep=$(old_row "$ms")
            # The experimental build cancels the oldest milestone's daily lanes
            # once a candidate with other code is pushed: until that candidate
            # is promoted, those cancels are not results. The last result stays.
            if [ "$BRANCH" = "experimental/$oldest" ] \
               && [ "$(awk -v b="candidate/$oldest" '$1 == b { print $2 }' <<< "$branches")" != "$SHA" ]; then
              echo "$BRANCH $short: a candidate replacing it is under test; not reported" >> "$GITHUB_STEP_SUMMARY"
              [ -n "$keep" ] && echo "$keep" >> rows.md \
                || echo "| $ms | \`$short\` | a candidate replacing it is under test | [none]($link) |" >> rows.md
              continue
            fi
            runs=$(gh run list -R "$REPO" --workflow pipeline-select-run-lanes.yml --commit "$SHA" -L 100 \
                     --json databaseId,attempt -q '.[] | "\(.databaseId) \(.attempt)"')
            if [ -z "$runs" ]; then
              # The oldest milestone's lanes run daily, started when its branch
              # moves (experimental-promote.yml); the newest's run on Sunday
              # (above), so between Sundays its branch may have moved on from
              # the commit its last result is for: that result stays, and the
              # row says which commit is waiting. A milestone between the two
              # has no lanes of its own: its pull requests are in the newest's.
              # A preview starts its own lanes.
              if [ "$ms" = "$oldest" ]; then
                echo "| $ms | \`$short\` | no lane runs yet | [none]($link) |" >> rows.md
              elif [ "$ms" = "$newest" ]; then
                if [ -n "$keep" ]; then
                  # Said once: yesterday's note is replaced, not added to.
                  base=$(sed -E 's/ Weekly lanes; `[0-9a-f]+` waits for Sunday\. \|$/ |/' <<< "$keep")
                  echo "${base% |} Weekly lanes; \`$short\` waits for Sunday. |" >> rows.md
                else
                  echo "| $ms | \`$short\` | no lane runs yet: weekly lanes, on Sunday | [none]($link) |" >> rows.md
                fi
              else
                echo "| $ms | \`$short\` | not run on this branch: its pull requests are in $newest's weekly lanes | [none]($link) |" >> rows.md
              fi
              continue
            fi
            busy=0
            : > all.tsv
            while read -r RUN attempt; do
              lanes "$RUN" > run.tsv
              if grep -q $'\trunning\t' run.tsv; then busy=1; fi
              cat run.tsv >> all.tsv
              [ "$attempt" = 1 ] || continue
              cap=0 other=0
              while IFS=$'\t' read -r name c id rerun; do
                case "$c" in
                  success|skipped|running) ;;
                  cancelled) if capacity "$id"; then cap=$((cap + 1)); else other=$((other + 1)); fi ;;
                  *) other=$((other + 1)) ;;
                esac
              done < run.tsv
              if [ "$cap" -gt 0 ] && [ "$other" -eq 0 ]; then
                [ -n "$DRY_RUN" ] || gh api -X POST "repos/$REPO/actions/runs/$RUN/rerun-failed-jobs" > /dev/null
                echo "$BRANCH $short: reran $cap lane(s) GitHub cancelled for want of a runner (run $RUN)" >> "$GITHUB_STEP_SUMMARY"
                busy=1
              fi
            done <<< "$runs"
            if [ "$busy" = 1 ]; then
              # Lanes still running: the last finished result stays in the
              # row, and the row says which commit is being tested.
              if [ -n "$keep" ] && [ "$(old_commit "$ms")" != "$short" ]; then
                echo "${keep% |} Lanes on \`$short\` running. |" >> rows.md
              elif [ -n "$keep" ]; then
                echo "$keep" >> rows.md
              else
                echo "| $ms | \`$short\` | running | [not yet]($link) |" >> rows.md
              fi
              echo "$BRANCH $short: lanes running; not reported" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            sort -t$'\t' -k1,1 -u all.tsv > lanes.tsv
            total=$(wc -l < lanes.tsv | tr -d ' ')
            awk -F'\t' '$2 != "success" && $2 != "skipped"' lanes.tsv > bad.tsv
            bad=$(wc -l < bad.tsv | tr -d ' ')
            reruns=$(awk -F'\t' '$2 == "success" && $4 == "rerun"' lanes.tsv | wc -l | tr -d ' ')
            if [ "$bad" -eq 0 ]; then
              cell="all $total passed"
            else
              cell="$bad of $total did not pass: $(awk -F'\t' '{ printf "%s%s (%s)", (NR > 1 ? ", " : ""), $1, $2 }' bad.tsv)"
            fi
            [ "$reruns" -eq 0 ] || cell="$cell; $reruns passed on a rerun"
            # The time in the row is when the last of these lanes finished,
            # not when this workflow looked: the block is rewritten whenever
            # any milestone's lanes finish, so the look is often days later
            # than the result it repeats.
            finished=$(gh run list -R "$REPO" --workflow pipeline-select-run-lanes.yml --commit "$SHA" -L 100 \
                         --json updatedAt -q 'map(.updatedAt) | max')
            finished=$(date -u -d "$finished" '+%Y-%m-%d %H:%M UTC')
            echo "| $ms | \`$short\` | $cell | [$finished]($link) |" >> rows.md
            [ "$ms" != "$newest" ] || [ "$bad" -gt 0 ] || [ "$total" -eq 0 ] || green=$ms
            # A draft preview of this milestone made from this commit is
            # published now its lanes all passed. The preview's commit and this
            # one are the same tree with one commit on top -- the version stamp
            # there, the CI overlay here -- so they share their parent.
            # All 16 runs -- the 15 families and macOS each preview starts
            # (experimental-preview.yml) -- not only those that exist: a
            # dispatch that stopped part-way leaves families with no run.
            nruns=$(printf '%s\n' "$runs" | grep -c .)
            if [ "$bad" -eq 0 ] && [ "$total" -gt 0 ] && [ "$nruns" -lt 16 ]; then
              echo "$BRANCH $short: $nruns of the 16 lane runs exist; no draft published" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$bad" -eq 0 ] && [ "$total" -gt 0 ] && [ "$nruns" -ge 16 ]; then
              parent=$(gh api "repos/$REPO/commits/$SHA" -q '.parents[0].sha')
              for t in $(gh release list -R "$REPO" -L 100 --json tagName,isDraft \
                           -q ".[] | select(.isDraft and (.tagName | startswith(\"preview-$ms-\"))) | .tagName"); do
                [ "$(gh api "repos/$REPO/commits/$t" -q '.parents[0].sha')" = "$parent" ] || continue
                if [ -n "$DRY_RUN" ]; then
                  echo "$t: would be published, all $total lanes on $short passed" >> "$GITHUB_STEP_SUMMARY"
                else
                  gh release edit "$t" -R "$REPO" --draft=false > /dev/null
                  echo "$t: published, all $total lanes on $short passed" >> "$GITHUB_STEP_SUMMARY"
                fi
              done
            fi
            echo "$BRANCH $short: $bad of $total not passed" >> "$GITHUB_STEP_SUMMARY"
            # One comment per commit whose lanes did not all pass. A commit the
            # block already shows with that result was commented on when it
            # first finished.
            if [ "$bad" -gt 0 ] && [ "$(old_commit "$ms")" != "$short" ]; then
              {
                echo "@$NOTIFY lanes on \`$BRANCH\` at \`$short\`: $bad of $total did not pass ([runs]($link))."
                echo
                echo "| lane | result |"
                echo "|---|---|"
                awk -F'\t' '{ printf "| %s | %s |\n", $1, $2 }' bad.tsv
                echo
              } >> comments.md
            fi
          done < <(grep '^experimental/' <<< "$branches" | sort -V)

          {
            echo "<!-- lanes -->"
            echo "## Lanes"
            echo
            echo "Written by the \`experimental lanes\` workflow once every lane run of a milestone's current commit has finished; the latest look is [this run]($RUN_URL)."
            echo
            echo "| milestone | commit | lanes | finished |"
            echo "|---|---|---|---|"
            sort -V -r rows.md
            echo "<!-- /lanes -->"
          } > block.md

          # The weekly preview of the newest milestone, once its lanes all passed.
          # A preview's release dates from its commit, not from when it was
          # made, so the week is counted from when the last one was published.
          if [ -n "$green" ]; then
            previews=$(gh release list -R "$REPO" -L 100 --json tagName,isDraft,publishedAt \
                         -q "[.[] | select(.tagName | startswith(\"preview-$green-\"))]")
            drafts=$(jq '[.[] | select(.isDraft)] | length' <<< "$previews")
            last=$(jq -r '[.[] | select(.isDraft | not) | .publishedAt] | max // ""' <<< "$previews")
            if [ "$drafts" -gt 0 ]; then
              echo "preview of $green: one is still a draft; not making another" >> "$GITHUB_STEP_SUMMARY"
            elif [ -n "$last" ] && [ "$(date -d "$last" +%s)" -gt "$(date -d '7 days ago' +%s)" ]; then
              echo "preview of $green: the last one was published $last, less than a week ago" >> "$GITHUB_STEP_SUMMARY"
            elif [ -n "$DRY_RUN" ]; then
              echo "preview of $green: would be made and published" >> "$GITHUB_STEP_SUMMARY"
            else
              gh workflow run experimental-preview.yml -R "$REPO" --ref main -f milestone="$green" -f publish=true
              echo "preview of $green: started" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [ -n "$DRY_RUN" ]; then
            { echo; echo "## Dry run: the Lanes block"; echo; cat block.md
              echo; echo "## Dry run: comments"; echo
              if [ -s comments.md ]; then cat comments.md; else echo "none"; fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ -n "$num" ] || { echo "::warning::no open issue titled \"$title\"; nothing written"; exit 0; }
          # Replace the block in the body; a body without one, from a build
          # older than this block, gets it before the report.
          if grep -q '^<!-- lanes -->$' <<< "$body"; then
            awk 'FNR == NR { blk = blk $0 "\n"; next }
                 /^<!-- lanes -->$/ { printf "%s", blk; skip = 1; next }
                 /^<!-- \/lanes -->$/ { skip = 0; next }
                 !skip' block.md <(printf '%s\n' "$body") > body.md
          else
            awk 'FNR == NR { blk = blk $0 "\n"; next }
                 /^# Xymon experimental integration$/ && !done { printf "%s\n", blk; done = 1 }
                 { print }
                 END { if (!done) printf "\n%s", blk }' block.md <(printf '%s\n' "$body") > body.md
          fi
          gh issue edit "$num" -R "$REPO" --body-file body.md > /dev/null
          [ -s comments.md ] && gh issue comment "$num" -R "$REPO" --body-file comments.md > /dev/null || true
